name: OLAP Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test_and_validate:
    name: Test & Validate OLAP Engine
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Quality & Linting (Ruff)
      run: |
        ruff check . || true

    - name: Generate Analytical Dataset & Init DuckDB
      run: |
        python scripts/generate_sample_data.py

    - name: Run OLAP Analytical Tests (Pytest)
      run: |
        pytest tests/ -v --durations=10

  deploy_notification:
    name: Continuous Deployment Verification
    needs: test_and_validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Log Deployment Status
      run: |
        echo "=========================================================="
        echo "✅ CI/CD Validation Passed Successfully!"
        echo "🚀 Streamlit Community Cloud automatically synchronizes"
        echo "   and deploys the latest version from branch 'main'."
        echo "=========================================================="
